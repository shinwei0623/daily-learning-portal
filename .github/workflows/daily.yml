name: 每日產文與發布

on:
  schedule:
    # 台北時間 00:30 = 前一日 16:30 UTC
    - cron: "30 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 還原音檔、圖片與 PDF
        run: python3 scripts/unpack-assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 每日產文
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate-daily.mjs

      - name: 若有新內容則提交
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content src/data public/audio public/images public/pdfs
          if git diff --staged --quiet; then
            echo "沒有新檔可提交"
          else
            git commit -m "chore: 每日學習內容 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - name: 建置網站
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/daily-learning-portal/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://shinwei0623.github.io/daily-learning-portal' }}
        run: npm run build

      - name: 嘗試產出 PDF
        run: npm run pdf
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
